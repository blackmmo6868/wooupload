# Nginx config trên HOST (không phải trong Docker)
# Copy vào: /etc/nginx/sites-available/wooupload
# ln -sf /etc/nginx/sites-available/wooupload /etc/nginx/sites-enabled/
# certbot --nginx -d upload.diethero.shop

server {
    server_name upload.diethero.shop;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
        proxy_read_timeout 300s;
    }
}
